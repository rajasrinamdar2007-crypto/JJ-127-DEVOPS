version: 1

# The scanner flagged .env.example because it carried the local stack's working passwords
# in a public repository. Those have been replaced with CHANGEME-* placeholders that
# cannot authenticate against anything, and the rules below stop the placeholders from
# re-alerting on every push. Removing this file without first emptying .env.example of
# real credentials would only silence a true positive.
#
# The old values are deliberately not quoted anywhere in this repository, including here.
# Naming them in a comment would republish them at the branch tip and hand the scanner
# exactly what it is looking for.
allow:
  - path: .env.example
    reason: >-
      Credential template. Every value is a CHANGEME-* placeholder, present only so a fresh
      clone starts. The real .env is gitignored and never committed.

# Anything that looks like a credential outside the template is treated as a real finding.
# This is the default; it is listed so the intent is explicit and so widening the allow list
# later is a deliberate act.
notify:
  - git: pre-commit
